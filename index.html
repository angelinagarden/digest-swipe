<style>
:root{--bg:#f6f4ef;--pane:#fff;--ink:#1a1822;--mut:#7a7488;--line:#e7e3da;--acc:#7c3aed;--yes:#16a34a;--post:#b45309;--postbg:#fef3c7;}
*{box-sizing:border-box;}
body{margin:0;background:var(--bg);color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;line-height:1.5;}
.wrap{max-width:720px;margin:0 auto;padding:0 16px 120px;}
header{padding:26px 0 8px;}
header h1{margin:0 0 4px;font-size:25px;font-weight:800;letter-spacing:-.3px;}
header p{margin:0;color:var(--mut);font-size:14px;}
.day{margin-top:30px;}
.day > h2{font-size:18px;font-weight:800;margin:0 0 4px;position:sticky;top:0;background:var(--bg);padding:10px 0 8px;z-index:5;border-bottom:1px solid var(--line);}
.day .sub{font-size:12.5px;color:var(--mut);margin:0 0 10px;}
.ev{background:var(--pane);border:1px solid var(--line);border-radius:16px;padding:15px 16px;margin-bottom:11px;transition:border-color .15s,box-shadow .15s;}
.ev.yes{border-color:var(--yes);box-shadow:0 0 0 1px var(--yes);}
.ev.post{border-color:var(--post);box-shadow:0 0 0 1px var(--post);background:linear-gradient(0deg,#fffdf5,#fff);}
.ev .chip{display:inline-flex;align-items:center;gap:5px;font-size:11.5px;font-weight:700;color:#fff;padding:3px 9px;border-radius:999px;vertical-align:middle;}
.ev h3{font-size:17.5px;font-weight:750;margin:9px 0 7px;line-height:1.22;}
.ev .desc{font-size:15px;color:#2c2936;margin:0 0 10px;}
.ev .desc.thin{color:var(--post);}
.ev .meta{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:12px;}
.ev .meta span{font-size:12.5px;background:#f1eee8;color:#4a4556;padding:4px 9px;border-radius:8px;}
.ev .meta a{font-size:12.5px;color:var(--acc);text-decoration:none;padding:4px 9px;border:1px solid var(--line);border-radius:8px;font-weight:600;}
.ev .bar{display:flex;gap:8px;flex-wrap:wrap;align-items:center;}
.tog{border:1.5px solid var(--line);background:#fff;color:var(--mut);border-radius:10px;padding:8px 14px;font-size:14px;font-weight:700;cursor:pointer;transition:.12s;}
.tog.y.on{background:var(--yes);border-color:var(--yes);color:#fff;}
.tog.n.on{background:#4b4653;border-color:#4b4653;color:#fff;}
.tog.p{margin-left:auto;}
.tog.p.on{background:var(--post);border-color:var(--post);color:#fff;}
.more{width:100%;margin-top:4px;background:#efece5;border:1px dashed var(--line);border-radius:12px;padding:12px;font-size:14px;font-weight:700;color:#5a5566;cursor:pointer;}
.hidden{display:none;}
#sum{position:fixed;left:0;right:0;bottom:0;background:#141019;color:#fff;padding:11px 16px calc(11px + env(safe-area-inset-bottom));display:flex;gap:12px;align-items:center;justify-content:center;z-index:20;box-shadow:0 -8px 24px rgba(0,0,0,.25);}
#sum .c{font-size:13.5px;}
#sum .c b{color:#fcd34d;}
#sum button{background:#7c3aed;border:none;color:#fff;font-weight:700;font-size:13.5px;border-radius:10px;padding:9px 14px;cursor:pointer;}
#sum button.ghost{background:#2a2633;}
#panel{position:fixed;inset:0;background:rgba(0,0,0,.5);z-index:30;display:none;align-items:flex-end;}
#panel .sheet{background:#fff;width:100%;max-width:720px;margin:0 auto;max-height:82vh;overflow-y:auto;border-radius:20px 20px 0 0;padding:20px 18px 30px;}
#panel h3{margin:0 0 4px;font-size:18px;}
#panel .lead{color:var(--mut);font-size:13px;margin-bottom:14px;}
#panel .g{font-weight:800;font-size:14px;margin:16px 0 8px;}
#panel .g.p{color:var(--post);}
#panel .r{border-bottom:1px solid var(--line);padding:9px 0;font-size:14.5px;}
#panel .r .m{color:var(--mut);font-size:12.5px;}
#panel .close{float:right;border:none;background:#eee;border-radius:8px;padding:6px 12px;font-weight:700;cursor:pointer;}
#panel .copy{margin-top:16px;width:100%;background:#7c3aed;color:#fff;border:none;border-radius:12px;padding:13px;font-weight:700;font-size:14px;cursor:pointer;}
.empty{color:var(--mut);font-size:13px;}
</style>
</head>

const KEY='brazhniki_digest_v3';
let st = JSON.parse(localStorage.getItem(KEY)||'{}'); // id -> {y:bool,n:bool,p:bool}
function save(){localStorage.setItem(KEY,JSON.stringify(st));upd();}
function esc(s){return (s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');}

function evHTML(e){
  let meta=[];
  if(e.venue)meta.push('<span>📍 '+esc(e.venue)+'</span>');
  if(e.time)meta.push('<span>🕐 '+esc(e.time)+'</span>');
  if(e.price)meta.push('<span>💶 '+esc(e.price)+'</span>');
  if(e.lang)meta.push('<span>🗣 '+esc(e.lang)+'</span>');
  if(e.url)meta.push('<a href="'+esc(e.url)+'" target="_blank" rel="noopener">источник ↗</a>');
  const s=st[e.id]||{};
  return '<div class="ev'+(s.p?' post':(s.y?' yes':''))+'" id="ev'+e.id+'">'
    +'<span class="chip" style="background:linear-gradient(90deg,'+e.c1+','+e.c2+')">'+e.icon+' '+esc(e.cat)+'</span>'
    +'<h3>'+esc(e.name)+'</h3>'
    +'<p class="desc'+(e.thin?' thin':'')+'">'+esc(e.desc)+(e.thin?' · (описание краткое — допишу)':'')+'</p>'
    +(meta.length?'<div class="meta">'+meta.join('')+'</div>':'')
    +'<div class="bar">'
    +'<button class="tog y'+(s.y?' on':'')+'" onclick="setY('+e.id+')">Да</button>'
    +'<button class="tog n'+(s.n?' on':'')+'" onclick="setN('+e.id+')">Нет</button>'
    +'<button class="tog p'+(s.p?' on':'')+'" onclick="setP('+e.id+')">✍️ Полный текст</button>'
    +'</div></div>';
}

function render(){
  const root=document.getElementById('root');
  root.innerHTML='';
  DATA.forEach((d,di)=>{
    const sec=document.createElement('div'); sec.className='day';
    const top=d.events.slice(0,10), rest=d.events.slice(10);
    sec.innerHTML='<h2>'+esc(d.day)+'</h2><p class="sub">'+d.events.length+' событий · показаны сильнейшие '+Math.min(10,d.events.length)+'</p>'
      +'<div>'+top.map(evHTML).join('')+'</div>'
      +(rest.length?'<div class="restwrap"><div class="rest hidden" id="rest'+di+'">'+rest.map(evHTML).join('')+'</div>'
         +'<button class="more" onclick="toggleMore('+di+',this)">показать ещё '+rest.length+' →</button></div>':'');
    root.appendChild(sec);
  });
  upd();
}
function toggleMore(di,btn){const r=document.getElementById('rest'+di);const h=r.classList.toggle('hidden');btn.textContent=h?('показать ещё '+r.children.length+' →'):'свернуть ↑';}
function flush(id){const e=document.getElementById('ev'+id);const s=st[id]||{};e.className='ev'+(s.p?' post':(s.y?' yes':''));e.querySelector('.tog.y').classList.toggle('on',!!s.y);e.querySelector('.tog.n').classList.toggle('on',!!s.n);e.querySelector('.tog.p').classList.toggle('on',!!s.p);}
function setY(id){const s=st[id]||{};s.y=!s.y;if(s.y)s.n=false;else s.p=false;st[id]=s;save();flush(id);}
function setN(id){const s=st[id]||{};s.n=!s.n;if(s.n){s.y=false;s.p=false;}st[id]=s;save();flush(id);}
function setP(id){const s=st[id]||{};s.p=!s.p;if(s.p){s.y=true;s.n=false;}st[id]=s;save();flush(id);}

function find(id){for(const d of DATA)for(const e of d.events)if(e.id===id)return e;}
function upd(){
  let y=0,p=0;for(const k in st){if(st[k].p)p++;else if(st[k].y)y++;}
  document.getElementById('cy').textContent=y;document.getElementById('cp').textContent=p;
}
document.getElementById('review').onclick=()=>{
  const posts=[],yes=[];
  for(const k in st){const e=find(+k);if(!e)continue;if(st[k].p)posts.push(e);else if(st[k].y)yes.push(e);}
  const rows=a=>a.length?a.map(e=>'<div class="r">'+esc(e.name)+'<div class="m">'+esc(e.day)+(e.venue?' · '+esc(e.venue):'')+'</div></div>').join(''):'<div class="empty">пусто</div>';
  document.getElementById('sheet').innerHTML='<button class="close" onclick="document.getElementById(\'panel\').style.display=\'none\'">закрыть</button>'
    +'<h3>Твой выбор</h3><div class="lead">Нажми ещё раз на кнопку в карточке, чтобы снять отметку.</div>'
    +'<div class="g p">✍️ Полный текст ('+posts.length+')</div>'+rows(posts)
    +'<div class="g">👍 Интересно ('+yes.length+')</div>'+rows(yes)
    +'<button class="copy" id="cpb">📋 Скопировать выбор для Пыли</button>';
  document.getElementById('panel').style.display='flex';
  document.getElementById('cpb').onclick=()=>{let t='ПОЛНЫЙ ТЕКСТ:\n'+posts.map(e=>'• '+e.name+' ('+e.day+')').join('\n')+'\n\nИНТЕРЕСНО:\n'+yes.map(e=>'• '+e.name+' ('+e.day+')').join('\n');navigator.clipboard.writeText(t).then(()=>{document.getElementById('cpb').textContent='✓ скопировано';});};
};
document.getElementById('panel').onclick=(e)=>{if(e.target.id==='panel')e.currentTarget.style.display='none';};
render();
</script>
</body>
</html>
