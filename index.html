.chip{background:rgba(0,0,0,.55);backdrop-filter:blur(4px);border-radius:999px;padding:4px 10px;font-size:11px;font-weight:600}
.score{background:rgba(0,0,0,.6)}
.body{flex:1;overflow-y:auto;padding:14px 16px 10px}

.desc{font-size:14px;line-height:1.5;color:#c6ccdb}

.fc .ok{color:#34d399;font-weight:700}
.fc a{color:#7cc0ff;text-decoration:none}
.actions{display:flex;gap:10px;padding:12px 2px 6px}
.act{flex:1;border:none;border-radius:16px;padding:15px 0;font-size:15px;font-weight:800;color:#fff}
.no{background:#2b2f3a}.yes{background:#16a34a}.post{background:#d97706}
.hint{text-align:center;font-size:11px;color:#5b6276;padding-bottom:6px}
.empty{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;color:#8b93a7;font-size:15px;text-align:center;padding:20px}
#sheet{position:fixed;inset:0;background:#0b0d12;z-index:50;display:none;flex-direction:column;max-width:480px;margin:0 auto}
#sheet.open{display:flex}
#sheet header{padding:14px 16px}
.sheetbody{flex:1;overflow-y:auto;padding:0 14px 20px}
.sec{margin-top:16px}
.sec h3{font-size:13px;color:#8b93a7;text-transform:uppercase;letter-spacing:.6px;margin-bottom:8px}

.item a{color:#7cc0ff;font-size:12px;text-decoration:none}
.rowbtns{display:flex;gap:8px;padding:12px 14px}
.rowbtns .act{font-size:14px;padding:13px 0}

</style></head><body>

</div>

const KEY='brazhniki_swipe_v1';
let choices=JSON.parse(localStorage.getItem(KEY)||'{}');
let order=EVENTS.map(e=>e.id).filter(id=>!(id in choices));
function save(){localStorage.setItem(KEY,JSON.stringify(choices))}
function imgUrl(u){return 'https://api.microlink.io/?url='+encodeURIComponent(u)+'&embed=image.url'}
function cur(){return order.length?EVENTS.find(e=>e.id===order[0]):null}
function render(){
  const st=document.getElementById('stage');
  document.getElementById('prog').textContent=(EVENTS.length-order.length)+' / '+EVENTS.length;
  const e=cur();
  if(!e){st.innerHTML='<div class="empty">Всё просмотрено 🎉<br>Жми «Мой отбор» наверху — там твои «Да» и «Полный пост».</div>';return}
  const grad='linear-gradient(135deg,'+e.c1+','+e.c2+')';
  st.innerHTML=
   '<div class="card" id="card">'
   +'<div class="pic" style="background:'+grad+'">'
     +'<div class="ph">'+e.icon+'</div>'
     +'<img referrerpolicy="no-referrer" src="'+imgUrl(e.url)+'" onload="this.style.opacity=1" onerror="this.remove()" style="opacity:0;transition:opacity .3s;position:relative;z-index:1">'
     +'<div class="chips"><span class="chip">'+e.day+'</span><span class="chip score">'+e.score+'/10</span></div>'
   +'</div>'
   +'<div class="body">'
     +'<div class="cat" style="color:'+e.c2+'">'+e.icon+' '+e.cat+'</div>'
     +'<h2>'+esc(e.name)+'</h2>'
     +'<div class="desc">'+esc(e.body)+'</div>'
     +'<div class="fc"><span class="ok">✓ ссылка проверена</span> · оценка редактора '+e.score+'/10 · <a href="'+e.url+'" target="_blank" rel="noopener">открыть ↗</a></div>'
   +'</div></div>';
}
function esc(s){return (s||'').replace(/[&<>]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]))}
function choose(v){
  const e=cur(); if(!e)return;
  choices[e.id]=v; save();
  const card=document.getElementById('card');
  if(card){const dx=v==='no'?-500:v==='yes'?500:0,dy=v==='post'?-600:0;card.style.transform='translate('+dx+'px,'+dy+'px) rotate('+(dx/30)+'deg)';card.style.opacity='0';}
  order.shift(); setTimeout(render,180);
}
// touch swipe
let sx=0,sy=0;
document.getElementById('stage').addEventListener('touchstart',e=>{sx=e.touches[0].clientX;sy=e.touches[0].clientY},{passive:true});
document.getElementById('stage').addEventListener('touchend',e=>{
  const dx=e.changedTouches[0].clientX-sx, dy=e.changedTouches[0].clientY-sy;
  if(Math.abs(dx)>70&&Math.abs(dx)>Math.abs(dy))choose(dx>0?'yes':'no');
  else if(dy<-70)choose('post');
});
document.addEventListener('keydown',e=>{
  if(document.getElementById('sheet').classList.contains('open'))return;
  if(e.key==='ArrowLeft')choose('no');if(e.key==='ArrowRight')choose('yes');if(e.key==='ArrowUp')choose('post');
});
function listBy(v){return EVENTS.filter(e=>choices[e.id]===v)}
function openSheet(){
  const yes=listBy('yes'),post=listBy('post');
  const row=e=>'<div class="item"><div class="n">'+esc(e.name)+'</div><div class="m">'+e.day+' · '+e.cat+' · '+e.score+'/10</div><a href="'+e.url+'" target="_blank" rel="noopener">'+e.url+'</a></div>';
  document.getElementById('sheetbody').innerHTML=
    '<div class="sec"><h3>⭐ Писать полный пост ('+post.length+')</h3>'+(post.map(row).join('')||'<div class="m" style="color:#5b6276">пока пусто</div>')+'</div>'
   +'<div class="sec"><h3>✓ Да ('+yes.length+')</h3>'+(yes.map(row).join('')||'<div class="m" style="color:#5b6276">пока пусто</div>')+'</div>';
  document.getElementById('sheet').classList.add('open');
}
function closeSheet(){document.getElementById('sheet').classList.remove('open');render()}
function copyAll(){
  const f=(t,a)=>t+'\n'+(a.length?a.map(e=>'• '+e.name+' — '+e.day+' — '+e.url).join('\n'):'—');
  const txt=f('⭐ ПОЛНЫЙ ПОСТ:',listBy('post'))+'\n\n'+f('✓ ДА:',listBy('yes'));
  navigator.clipboard.writeText(txt).then(()=>alert('Скопировано!')).catch(()=>{prompt('Скопируй вручную:',txt)});
}
function resetAll(){if(confirm('Сбросить все отметки?')){choices={};save();order=EVENTS.map(e=>e.id);closeSheet();render()}}
render();
</script></body></html>
